<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlainUI style gallery</title><link rel="stylesheet" href="../../dist/plainui.css"><style>.theme{--ui-color-primary:#6d28d9;--ui-space-4:1.25rem}.sample{border:1px solid currentColor;padding:var(--ui-space-4)}</style></head>
<body><main class="ui-container ui-stack">
  <h1>PlainUI style gallery</h1>
  <section class="ui-stack sample"><h2>Native controls</h2><label>Name <input value="Ada"></label><label>Email <input aria-invalid="true" value="invalid"></label><p class="ui-field-error">Enter a valid email address.</p><div class="ui-cluster"><button>Continue</button><button disabled>Disabled</button></div></section>
  <section class="ui-grid"><article class="sample">A responsive grid item with text that wraps on narrow screens.</article><article class="sample" hidden>This must remain hidden.</article><article class="sample">Another item</article></section>
  <section class="ui-stack sample" dir="rtl"><h2>Right to left</h2><label>الاسم <input value="آدا"></label><div class="ui-cluster"><button>متابعة</button><button>إلغاء</button></div></section>
  <section class="ui-stack sample theme"><h2>Token override</h2><button>Overridden primary focus color</button></section>
  <dialog aria-label="Example dialog"><p>Native dialog styling</p><button>Close</button></dialog>
</main></body></html>

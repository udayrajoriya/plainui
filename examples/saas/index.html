<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="plainui-demo-adapter" content="{{SERVER_ADAPTER}}"><title>PlainUI SaaS</title><link rel="stylesheet" href="/dist/plainui.css"><link rel="stylesheet" href="/styles.css"></head>
<body><main ui-app="saas" ui-store='{"user":null}' ui-persist="session" ui-persist-key="saas-user-v1"><div ui-state='{"page":1,"selectedProjectId":"pr1","draft":{"name":"Website","description":"Public site redesign"},"tab":"overview","uncertain":false}'>
<header><strong>PlainUI SaaS</strong> <nav aria-label="Primary"><a href="/projects" ui-link>Projects</a> <button type="button" ui-on:click="logout()">Log out</button></nav></header><div ui-outlet></div>
<template ui-route="/login" ui-title="'Sign in · PlainUI SaaS'"><h1 tabindex="-1">Sign in</h1><form action="/api/session" method="post" ui-post="/api/session" ui-action="login" ui-body="{'email': email, 'password': password}" ui-adapter="demo" ui-on:success="completeLogin($result.user)" ui-state='{"email":"demo@example.test","password":"plainui-demo"}'><label for="login-email">Email</label><input id="login-email" name="email" type="email" required ui-model="email"><label for="password">Password</label><input id="password" name="password" type="password" required ui-model="password"><button>Sign in</button><p aria-live="polite" ui-show="login.pending">Signing in…</p><p role="alert" ui-show="login.status === 'error'">Sign-in failed. Check the sample credentials.</p></form></template>
<template ui-route="/projects" ui-title="'Projects · PlainUI SaaS'"><h1 tabindex="-1">Projects</h1><template ui-data="projects" ui-get="/api/projects" ui-query="{'page': page}" ui-adapter="demo"></template><p ui-show="projects.loading">Loading projects…</p><p role="alert" ui-show="projects.status === 'error'">Projects could not be loaded. <button type="button" ui-on:click="refresh('projects')">Retry</button></p><ul><template ui-for="projectRow in projects.data.items" ui-key="projectRow.id"><li><a ui-href="'/projects/' + projectRow.id" ui-text="projectRow.name" ui-link ui-on:click="selectProject(projectRow.id)"></a></li></template></ul><button type="button" ui-on:click="previousPage()">Previous</button><button type="button" ui-on:click="nextPage()">Next</button></template>
<template ui-route="/projects/:id" ui-title="'Project · PlainUI SaaS'"><p><a href="/projects" ui-on:click.prevent="guardLeave()">Back to projects</a></p><h1 tabindex="-1">Project detail</h1><template ui-data="project" ui-get="/api/projects/{selectedProjectId}" ui-adapter="demo"></template><template ui-data="activity" ui-get="/api/projects/{selectedProjectId}/activity" ui-adapter="demo"></template><template ui-data="metrics" ui-get="/api/projects/{selectedProjectId}/metrics" ui-adapter="demo"></template><p ui-show="project.loading">Loading project…</p><p role="alert" ui-show="project.status === 'error'">Project could not be loaded.</p><section ui-show="project.status === 'success'"><h2 ui-text="project.data.name"></h2><p ui-text="project.data.description"></p></section>
<div role="tablist" aria-label="Project sections" ui-use="manualTabs"><button type="button" role="tab" ui-bind-aria-selected="tab === 'overview'" ui-on:click="setTab('overview')">Overview</button><button type="button" role="tab" ui-bind-aria-selected="tab === 'activity'" ui-on:click="setTab('activity')">Activity</button></div><section role="tabpanel" ui-show="tab === 'overview'"><h2>Metrics</h2><div ui-use="metricChart" ui-options='{"dataPath":"metrics.data"}' ui-ref="metricChart"><div ui-ignore><canvas width="320" height="120" aria-label="Project metrics chart" role="img"></canvas></div></div></section><section role="tabpanel" ui-show="tab === 'activity'"><h2>Activity</h2><ul><template ui-for="event in activity.data.items" ui-key="event.id"><li ui-text="event.message"></li></template></ul></section>
<h2>Edit project</h2><form action="/api/projects/p1" method="post" ui-patch="/api/projects/{selectedProjectId}" ui-action="edit" ui-ref="editForm" ui-body="{'name': draft.name, 'description': draft.description}" ui-adapter="demo" ui-invalidate="project activity" ui-on:success="editConfirmed()"><label for="project-name">Name</label><input id="project-name" name="name" required ui-model="draft.name" ui-on:input="markDirty()"><span ui-field-error="name"></span><label for="description">Description</label><textarea id="description" name="description" ui-model="draft.description" ui-on:input="markDirty()"></textarea><span ui-field-error="description"></span><button>Save project</button><button type="button" ui-on:click="reset('editForm')">Reset</button><p ui-show="edit.pending">Saving…</p><p role="alert" ui-show="edit.status === 'error'">Save failed. Values are preserved; reconcile before retrying an uncertain result.</p></form><button type="button" ui-get="/api/projects/{selectedProjectId}" ui-action="reconcile" ui-adapter="demo">Reconcile project</button><p ui-show="reconcile.status === 'success'">Server state confirmed.</p></template>
<template ui-route="*" ui-title="'Not found · PlainUI SaaS'"><h1 tabindex="-1">Page not found</h1><a href="/projects" ui-link>Go to projects</a></template>
<dialog ui-ref="savedDialog"><h2>Project saved</h2><p>The server confirmed the update.</p><form method="dialog"><button>Close</button></form></dialog><p role="status" ui-show="uncertain">The last mutation outcome is uncertain. Use Reconcile project before retrying.</p></div></main><script type="module" src="/app.mjs"></script></body></html>
